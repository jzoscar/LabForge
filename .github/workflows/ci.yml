name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check --select F,E9 labforge tests
      - name: Tests (include a simulated device lab on localhost)
        run: pytest -q
      - name: Validate the example IaC
        run: labforge validate infra
      - name: Plan (job summary)
        run: labforge plan infra --format markdown >> "$GITHUB_STEP_SUMMARY"
