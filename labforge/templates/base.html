<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LabForge{% endblock %} · LabForge</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">LabForge</a>
  <nav>
    <a href="/" class="{{ 'on' if nav == 'dash' }}">Overview</a>
    <a href="/resources" class="{{ 'on' if nav == 'res' }}">Resources</a>
    <a href="/rigs" class="{{ 'on' if nav == 'rigs' }}">Rigs</a>
    <a href="/alerts" class="{{ 'on' if nav == 'alerts' }}">Alerts</a>
    <a href="/builds" class="{{ 'on' if nav == 'builds' }}">Builds</a>
    <a href="/compliance" class="{{ 'on' if nav == 'compliance' }}">Compliance</a>
    <a href="/iac" class="{{ 'on' if nav == 'iac' }}">IaC</a>
    <a href="/runs" class="{{ 'on' if nav == 'runs' }}">Runs</a>
    <a href="/audit" class="{{ 'on' if nav == 'audit' }}">Audit</a>
    <a href="/docs">API</a>
  </nav>
  {% set who = signed_in(request) %}
  {% if who %}<span class="who" title="{{ who.envs|join(', ') }}">{{ who.name }} · {{ who.role }}</span>{% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
