[project]
name = "labforge"
version = "0.1.0"
description = "IaC-driven lab platform: orchestrate and monitor dev/test/R&D hardware, servers, containers and networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "psutil>=5.9",
]

[project.optional-dependencies]
windows = ["pywinrm>=0.4"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
labforge = "labforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
