# Pre-production: mirrors the production topology at smaller scale.
# Separate VLANs per role, two gateway nodes behind an HAProxy edge, a dedicated database host,
# a pool of sensors with power control, and Windows clients on both architectures.
apiVersion: labforge/v1
kind: Environment
metadata:
  name: staging
  tier: staging
  description: Pre-production - same topology as production, release candidates only
  labels: { scope: pre-production, release: candidate }
spec:
  networks:
    - name: stg-net
      type: vlan
      cidr: 10.30.0.0/16
      subnets:
        - { name: mgmt,    cidr: 10.30.0.0/24, gateway: 10.30.0.1, vlan: 300 }
        - { name: devices, cidr: 10.30.1.0/24, gateway: 10.30.1.1, vlan: 301 }
        - { name: clients, cidr: 10.30.2.0/24, gateway: 10.30.2.1, vlan: 302 }
        - { name: app,     cidr: 10.30.3.0/24, gateway: 10.30.3.1, vlan: 303 }
        - { name: edge,    cidr: 10.30.4.0/24, gateway: 10.30.4.1, vlan: 304 }

  hosts:
    # --- sensors ---
    - name: stg-sensor-01
      kind: baremetal
      platform: { os: linux, arch: arm64 }
      address: 10.30.1.11
      subnet: stg-net/devices
      bmc: { type: redfish, address: 10.30.0.11, credentialsRef: stg-bmc }
      power: "on"
      connection: { type: ssh, user: root, keyRef: stg-ssh-key }
      onDestroy: poweroff
      monitor:
        agent: true
        probes: [ { type: ping }, { type: http, port: 80, path: /version } ]
      labels: { role: sensor }
    - name: stg-sensor-02
      kind: baremetal
      platform: { os: linux, arch: arm64 }
      address: 10.30.1.12
      subnet: stg-net/devices
      bmc: { type: redfish, address: 10.30.0.12, credentialsRef: stg-bmc }
      power: "on"
      connection: { type: ssh, user: root, keyRef: stg-ssh-key }
      onDestroy: poweroff
      monitor:
        agent: true
        probes: [ { type: ping }, { type: http, port: 80, path: /version } ]
      labels: { role: sensor }
    - name: stg-sensor-03
      kind: baremetal
      platform: { os: linux, arch: arm64 }
      address: 10.30.1.13
      subnet: stg-net/devices
      bmc: { type: redfish, address: 10.30.0.13, credentialsRef: stg-bmc }
      power: "on"
      connection: { type: ssh, user: root, keyRef: stg-ssh-key }
      onDestroy: poweroff
      monitor:
        agent: true
        probes: [ { type: ping }, { type: http, port: 80, path: /version } ]
      labels: { role: sensor }

    # --- Windows clients ---
    - name: stg-win-x64
      kind: baremetal
      platform: { os: windows, arch: amd64 }
      address: 10.30.2.21
      subnet: stg-net/clients
      bmc: { type: redfish, address: 10.30.0.21, credentialsRef: stg-bmc }
      connection: { type: winrm, user: Administrator, passwordRef: stg-win-admin }
      monitor:
        agent: true
        probes: [ { type: ping }, { type: tcp, port: 5985 } ]
      labels: { role: client }
    - name: stg-win-arm64
      kind: baremetal
      platform: { os: windows, arch: arm64 }
      address: 10.30.2.22
      subnet: stg-net/clients
      connection: { type: winrm, user: Administrator, passwordRef: stg-win-admin }
      monitor:
        agent: true
        probes: [ { type: ping }, { type: tcp, port: 5985 } ]
      labels: { role: client }

    # --- services ---
    - name: stg-app-01
      kind: vm
      platform: { os: linux, arch: amd64 }
      address: 10.30.3.11
      subnet: stg-net/app
      connection: { type: ssh, user: ops }
      monitor:
        agent: true
        probes: [ { type: ping }, { type: http, port: 8080, path: /healthz } ]
      labels: { role: service }
    - name: stg-app-02
      kind: vm
      platform: { os: linux, arch: amd64 }
      address: 10.30.3.12
      subnet: stg-net/app
      connection: { type: ssh, user: ops }
      monitor:
        agent: true
        probes: [ { type: ping }, { type: http, port: 8080, path: /healthz } ]
      labels: { role: service }
    - name: stg-db-01
      kind: vm
      platform: { os: linux, arch: amd64 }
      address: 10.30.3.20
      subnet: stg-net/app
      connection: { type: ssh, user: ops }
      monitor:
        agent: true
        probes: [ { type: ping }, { type: tcp, port: 5432 } ]
      labels: { role: database }
    - name: stg-edge-01
      kind: vm
      platform: { os: linux, arch: amd64 }
      address: 10.30.4.10
      subnet: stg-net/edge
      connection: { type: ssh, user: ops }
      monitor:
        agent: true
        probes: [ { type: ping }, { type: tcp, port: 443 } ]
      labels: { role: edge }

  loadBalancers:
    - name: stg-gateway
      network: stg-net
      vip: 10.30.4.100
      driver: haproxy
      host: stg-edge-01
      listeners:
        - { port: 443, protocol: https, targetPort: 8443 }
        - { port: 80,  protocol: http,  targetPort: 8080 }
      targets: [ stg-app-01, stg-app-02 ]
      healthCheck: { protocol: http, port: 8080, path: /healthz }

  containers:
    - name: gateway
      host: stg-app-01
      image: registry.lab.local/sensor-gateway:rc
      ports: ["8080:8080", "8443:8443"]
      secretEnv: { DB_PASSWORD: stg-db-password }
    - name: gateway-b
      host: stg-app-02
      image: registry.lab.local/sensor-gateway:rc
      ports: ["8080:8080", "8443:8443"]
      secretEnv: { DB_PASSWORD: stg-db-password }
    - name: gateway-db
      host: stg-db-01
      image: postgres:16
      ports: ["5432:5432"]
      volumes: ["/data/postgres:/var/lib/postgresql/data"]
      env: { POSTGRES_DB: gateway }
      secretEnv: { POSTGRES_PASSWORD: stg-db-password }
