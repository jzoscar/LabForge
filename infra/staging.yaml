# Pre-production (staging) environment: cloud VPC + managed load balancer, delegated to Terraform modules
apiVersion: labforge/v1
kind: Environment
metadata:
  name: staging
  tier: staging
spec:
  networks:
    - name: stg-vpc
      type: vpc
      cidr: 172.16.0.0/16
      driver: terraform
      terraform:
        module: terraform/vpc
        vars: { region: cn-north-1 }
      subnets:
        - { name: app, cidr: 172.16.1.0/24, gateway: 172.16.1.1 }

  hosts:
    - name: stg-app-01
      kind: cloud
      platform: { os: linux, arch: arm64 }
      address: 172.16.1.10
      subnet: stg-vpc/app
      connection: { type: ssh, user: ec2-user }
      monitor: { probes: [ { type: ping }, { type: http, port: 8080, path: /healthz } ] }

  loadBalancers:
    - name: stg-alb
      network: stg-vpc
      driver: terraform
      terraform: { module: terraform/lb }
      listeners: [ { port: 443, protocol: https, targetPort: 8080 } ]
      targets: [ stg-app-01 ]
      healthCheck: { protocol: http, port: 8080, path: /healthz }
