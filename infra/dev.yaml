# Development environment: physical ARM test boards + Windows machines + Linux server + containers + VPC + load balancer
# Secrets never live here: each xxxRef points to the environment variable LABFORGE_SECRET_<NAME>
#   LABFORGE_SECRET_BMC_DEFAULT="admin:password"
#   LABFORGE_SECRET_LAB_SSH_KEY="/home/ops/.ssh/lab_ed25519"
#   LABFORGE_SECRET_WIN_ADMIN="..."
apiVersion: labforge/v1
kind: Environment
metadata:
  name: dev
  tier: dev
  description: Development integration environment
spec:
  networks:
    - name: lab-vpc
      type: vpc
      cidr: 10.20.0.0/16
      subnets:
        - { name: mgmt, cidr: 10.20.0.0/24, gateway: 10.20.0.1, vlan: 100 }   # BMC / out-of-band management
        - { name: arm,  cidr: 10.20.1.0/24, gateway: 10.20.1.1, vlan: 101 }   # ARM test boards
        - { name: win,  cidr: 10.20.2.0/24, gateway: 10.20.2.1, vlan: 102 }   # Windows test machines
        - { name: svc,  cidr: 10.20.3.0/24, gateway: 10.20.3.1, vlan: 103 }   # servers / containers

  hosts:
    # --- Physical ARM test hardware (Redfish/IPMI BMC, remote power control) ---
    - name: arm-node-01
      kind: baremetal
      platform: { os: linux, arch: arm64, distro: ubuntu, version: "24.04" }
      address: 10.20.1.11
      subnet: lab-vpc/arm
      bmc: { type: redfish, address: 10.20.0.11, credentialsRef: bmc-default }
      power: "on"
      connection: { type: ssh, user: lab, keyRef: lab-ssh-key }
      bootstrap:
        - sudo apt-get install -y python3-psutil
        - sudo mkdir -p /opt/labforge
      monitor:
        agent: true
        probes: [ { type: ping }, { type: tcp, port: 22 } ]
      labels: { board: ampere-altra, rack: r1-u12 }

    - name: arm-node-02
      kind: baremetal
      platform: { os: linux, arch: arm64, distro: debian, version: "12" }
      address: 10.20.1.12
      subnet: lab-vpc/arm
      bmc: { type: ipmi, address: 10.20.0.12, credentialsRef: bmc-default }
      power: "on"
      connection: { type: ssh, user: lab, keyRef: lab-ssh-key }
      monitor:
        agent: true
        probes: [ { type: ping }, { type: tcp, port: 22 } ]
      labels: { board: rk3588, rack: r1-u14 }

    # --- Physical Windows test machine ---
    - name: win-test-01
      kind: baremetal
      platform: { os: windows, arch: amd64, version: "11-23H2" }
      address: 10.20.2.21
      subnet: lab-vpc/win
      bmc: { type: redfish, address: 10.20.0.21, credentialsRef: bmc-default }
      connection: { type: winrm, user: Administrator, passwordRef: win-admin }
      bootstrap:
        - Set-Service -Name WinRM -StartupType Automatic
      monitor:
        agent: true
        probes: [ { type: ping }, { type: tcp, port: 5985 }, { type: tcp, port: 3389 } ]
      labels: { rack: r2-u03 }

    # --- Windows on ARM ---
    - name: win-arm-01
      kind: baremetal
      platform: { os: windows, arch: arm64, version: "11-24H2" }
      address: 10.20.2.31
      subnet: lab-vpc/win
      connection: { type: winrm, user: Administrator, passwordRef: win-admin }
      monitor:
        agent: true
        probes: [ { type: ping }, { type: tcp, port: 5985 } ]
      labels: { device: snapdragon-x-devkit }

    # --- Linux server (runs containers + haproxy) ---
    - name: svc-01
      kind: vm
      platform: { os: linux, arch: amd64, distro: rocky, version: "9" }
      address: 10.20.3.10
      subnet: lab-vpc/svc
      connection: { type: ssh, user: ops }
      monitor:
        agent: true
        probes: [ { type: ping }, { type: tcp, port: 22 } ]

  loadBalancers:
    - name: test-api
      network: lab-vpc
      vip: 10.20.3.100
      driver: haproxy
      host: svc-01
      listeners:
        - { port: 8080, protocol: http, targetPort: 8080 }
      targets: [ arm-node-01, arm-node-02 ]
      healthCheck: { protocol: http, port: 8080, path: /healthz }

  containers:
    - name: artifact-cache
      host: svc-01
      image: registry:2
      ports: ["5000:5000"]
      volumes: ["/data/registry:/var/lib/registry"]
    - name: test-db
      host: svc-01
      image: postgres:16
      ports: ["5432:5432"]
      env: { POSTGRES_DB: testdb }
      secretEnv: { POSTGRES_PASSWORD: test-db-password }
